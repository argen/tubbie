[package]
name = "tubbie"
version = "1.0.0"
edition = "2021"
description = "Tubbie — TfL tube arrivals board desktop app"
publish = false

[lib]
name = "tubbie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tfl-domain = { path = "../crates/tfl-domain" }
tfl-client = { path = "../crates/tfl-client" }
tfl-cache = { path = "../crates/tfl-cache" }
tfl-board = { path = "../crates/tfl-board" }

tauri = { version = "2", features = ["macos-private-api", "test", "tray-icon", "image-png"] }
tauri-plugin-store = "2"
# Pinned to the exact patch matched against the project's Tauri version.
# Tauri 2.x's updater plugin has had migration churn between point releases;
# floating on "2" risks a silent break on `cargo update`. Bump in lockstep
# with the `tauri` crate after running the manifest-shape test
# (`updater_manifest_shape.rs`, added in PR-B).
tauri-plugin-updater = "=2.10.1"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
futures = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
reqwest = { workspace = true }
# Tray-title projection derives a chrono::Duration for the canonical
# tfl_domain::format::format_time_to_station ETA formatter.
chrono = { workspace = true }
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSObject",
    "NSString",
] }
objc2-core-location = { version = "0.3", features = [
    "CLError",
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }

[dev-dependencies]
# `test-util` is required by tests that use `#[tokio::test(start_paused = true)]`
# and `tokio::time::advance` to drive the watch-channel/stream pipeline under
# a paused clock. Without it the integration tests in `commands.rs::tests`
# that exercise `save_config_inner → cfg_tx → stream` will not compile.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
url = { workspace = true }
# Pool-key tests use wiremock to mock the key-server without hitting the network.
wiremock = "0.6"
