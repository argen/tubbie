name: Fixture freshness

# Monthly check: re-record TfL API fixtures and open a PR if anything changed.
# Never auto-merges — a human must eyeball the shape diff before merging.
#
# Required repo secret: TFL_APP_KEY
#   Set at: Settings → Secrets and variables → Actions → New repository secret
#   The fixture-recorder binary reads this via std::env::var("TFL_APP_KEY").
#   Without it the recorder will succeed with anonymous (rate-limited) calls
#   or fail with a 429; the job will error-out loudly in either case because
#   the secret-presence check step runs first.
#
# To run manually: Actions → "Fixture freshness" → Run workflow.
# DO NOT auto-merge the resulting PR — eyeball the shape diff first.

on:
  schedule:
    # 06:05 UTC on the 1st of each month.
    - cron: '5 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-fixtures:
    name: record and diff fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Verify TFL_APP_KEY secret is present
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: |
          if [ -z "$TFL_APP_KEY" ]; then
            echo "::error::Repository secret TFL_APP_KEY is not set."
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "The fixture-recorder binary reads TFL_APP_KEY from the environment."
            exit 1
          fi
          echo "TFL_APP_KEY is set."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-25

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install Tauri system dependencies (required by workspace build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Capture date for PR title
        id: date
        run: echo "YYYY-MM=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Record fixtures
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: just record-fixtures

      - name: Check for fixture changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Summarise (no changes)
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "## Fixture freshness — no changes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All recorded fixtures match the current live TfL API responses." >> "$GITHUB_STEP_SUMMARY"
          echo "No PR opened." >> "$GITHUB_STEP_SUMMARY"

      - name: Open fixture-refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/fixture-refresh-${{ steps.date.outputs.YYYY-MM }}
          commit-message: "chore(fixtures): monthly TfL fixture refresh (${{ steps.date.outputs.YYYY-MM }})"
          title: "chore(fixtures): monthly TfL fixture refresh (${{ steps.date.outputs.YYYY-MM }})"
          body: |
            ## Monthly TfL fixture refresh — ${{ steps.date.outputs.YYYY-MM }}

            This PR was opened automatically by the
            [Fixture freshness](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            workflow after `just record-fixtures` detected changes in the live
            TfL API responses.

            ### Changed files

            ```
            See the Files changed tab above.
            ```

            > **DO NOT auto-merge** — eyeball the shape diff first.
            >
            > Common benign changes: new/removed stops, updated line names, refreshed ETA data.
            > Suspicious changes: missing modes, empty arrays where data is expected, schema shifts.
            >
            > If the shape looks wrong, close this PR and investigate before the next scheduled run.

            ---
            _Opened by [Fixture freshness workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_
          labels: chore,fixtures
          draft: false
          delete-branch: true
