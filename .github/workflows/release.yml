name: Release

# Cheap public-distribution path: tag-triggered, single arm64 macOS build,
# unsigned. End users get a Gatekeeper warning that the README documents
# how to clear. Signing/notarization for a one-click experience is the
# full M8 plan in docs/ADR/distribution-roadmap.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-25
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install web deps
        working-directory: web
        run: npm ci --ignore-scripts

      # Mirrors CI's pattern: --ignore-scripts blocks install-time RCE,
      # so re-run the prepare hook manually for the SvelteKit-sync types
      # the build needs.
      - name: SvelteKit sync (regenerate types)
        working-directory: web
        run: npx --no-install svelte-kit sync

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tubbie ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
          releaseBody: |
            **Unsigned macOS build for Apple Silicon (arm64).**

            Mount the `.dmg` and drag Tubbie to Applications. macOS will quarantine the unsigned app — right-click → **Open** the first time, or run:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Tubbie.app
            ```

            Signing and notarization for a one-click experience is tracked as M8 in `docs/ADR/distribution-roadmap.md`.
