name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `--ignore-scripts` blocks the `prepare` hook (svelte-kit sync),
      # which generates `.svelte-kit/` types ESLint and svelte-check
      # need. Re-run it explicitly here so the install-time RCE class
      # stays neutralised but our build still works.
      - name: SvelteKit sync (regenerate types)
        run: npx --no-install svelte-kit sync

      - name: Assert cookie >= 0.7 (GHSA-pxg6-pf52-xh8x)
        run: |
          npm ls cookie --json --all \
            | jq -e '[.. | objects | to_entries[]? | select(.key=="cookie") | .value.version]
                     | unique
                     | (length > 0)
                       and all(startswith("0.7.") or startswith("0.8.") or startswith("1."))'

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-25
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          # The action runs in a musl container. Our rust-toolchain.toml
          # pins `channel = "stable"`, which rustup resolves in there to
          # stable-x86_64-unknown-linux-musl — a toolchain the image does
          # not ship, so the job died before evaluating a single advisory.
          # Setting rust-version makes the entrypoint run `rustup default`,
          # which installs it.
          rust-version: stable

  osv-scan:
    name: osv-scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      contents: read
      actions: read
      # security-events kept granted because the reusable workflow's
      # static validation requires it even when upload-sarif=false
      # skips the actual upload step at runtime.
      security-events: write
    with:
      scan-args: |-
        --recursive
        --skip-git
        ./
      fail-on-vuln: true
      # SARIF upload requires GitHub code scanning, which is only free
      # on public repos. Re-enable (set to true / drop the line) once
      # the repo flips public.
      upload-sarif: false

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies (for cargo metadata)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-04-25
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1

      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx

      - name: Generate Rust SBOM
        run: cargo cyclonedx --format json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Generate frontend SBOM
        working-directory: web
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format JSON --output-file ../web-sbom.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            **/bom.json
            web-sbom.json
          if-no-files-found: error
