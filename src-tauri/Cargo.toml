[package]
name = "tubbie"
version = "0.1.0"
edition = "2021"
description = "Tubbie — TfL tube arrivals board desktop app"
publish = false

[lib]
name = "tubbie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tfl-domain = { path = "../crates/tfl-domain" }
tfl-client = { path = "../crates/tfl-client" }
tfl-board = { path = "../crates/tfl-board" }

tauri = { version = "2", features = ["macos-private-api", "test", "tray-icon", "image-png"] }
tauri-plugin-store = "2"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
futures = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
